<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TalkativeBot Architecture</title>
  <desc id="desc">Layered architecture: application conversations and topics, TalkativeBot orchestration, pluggable channels, and pending interaction persistence.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>
    <linearGradient id="starterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="579" rx="16" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Header -->
  <text x="600" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#0f172a">TalkativeBot</text>
  <text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" text-anchor="middle" fill="#64748b">Channel-agnostic conversation orchestration · Java 17 · Spring Boot 3</text>

  <!-- Transport layer -->
  <text x="56" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">TRANSPORT</text>

  <g filter="url(#shadow)">
    <rect x="56" y="140" width="200" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="88" cy="176" r="14" fill="#e2e8f0"/>
    <text x="88" y="181" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">⌨</text>
    <text x="148" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Console</text>
    <text x="148" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">stdin / stdout</text>

    <rect x="276" y="140" width="200" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="308" cy="176" r="14" fill="#e2e8f0"/>
    <text x="308" y="181" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">⇄</text>
    <text x="368" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">Spring Cloud Stream</text>
    <text x="368" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748b">RabbitMQ / messaging</text>

    <rect x="496" y="140" width="200" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="528" cy="176" r="14" fill="#f1f5f9"/>
    <text x="528" y="181" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#94a3b8">+</text>
    <text x="588" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Custom channels</text>
    <text x="588" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">REST · Slack · …</text>

    <rect x="716" y="140" width="428" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="930" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Same conversation logic across transports — no rewrite per channel</text>
    <text x="930" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Not a chatbot platform · human-in-the-loop orchestration</text>
  </g>

  <!-- Arrows transport → channels -->
  <line x1="156" y1="212" x2="156" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="212" x2="376" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="596" y1="212" x2="596" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Starter band -->
  <rect x="40" y="248" width="1120" height="200" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="56" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb" letter-spacing="0.06em">talkativebot-spring-boot-starter</text>

  <!-- Channel adapters -->
  <rect x="56" y="282" width="1088" height="56" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="80" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e40af">InputChannel</text>
  <text x="200" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">→ IncomingMessage</text>
  <text x="560" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">OutputChannelRegistry → OutputChannel</text>
  <text x="1000" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="end">OutgoingMessage</text>

  <!-- Core orchestrator -->
  <rect x="56" y="352" width="1088" height="84" rx="10" fill="url(#coreGrad)" filter="url(#shadow)"/>
  <text x="80" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="0.06em">talkativebot-core</text>
  <text x="80" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">TalkativeBot</text>
  <text x="280" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#bfdbfe">handle() · play() · ask() · conclude()</text>

  <!-- Flow pills inside core -->
  <rect x="480" y="384" width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1"/>
  <text x="539" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e0f2fe" text-anchor="middle">1. Incoming</text>

  <rect x="612" y="384" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1"/>
  <text x="677" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e0f2fe" text-anchor="middle">2. Resume / Start</text>

  <rect x="756" y="384" width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1"/>
  <text x="815" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e0f2fe" text-anchor="middle">3. Topics</text>

  <rect x="888" y="384" width="118" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1"/>
  <text x="947" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#e0f2fe" text-anchor="middle">4. Ask</text>

  <text x="1040" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#93c5fd">5. Reply →</text>

  <!-- Arrow core to app -->
  <line x1="600" y1="436" x2="600" y2="468" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Application layer -->
  <text x="56" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#059669" letter-spacing="0.08em">YOUR APPLICATION</text>

  <g filter="url(#shadow)">
    <rect x="56" y="500" width="340" height="88" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="80" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46">AbstractConversation</text>
    <text x="80" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857">Topic graph · Facts · onTopicPlayed</text>
    <text x="80" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857">Business workflow logic</text>

    <rect x="416" y="500" width="340" height="88" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="440" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46">@Topic classes</text>
    <text x="440" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857">doPlay() · onInput() · order / next</text>
    <text x="440" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857">Questions · choices · branching</text>

    <rect x="776" y="500" width="368" height="88" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="800" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46">ConversationStartResolver</text>
    <text x="800" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857">Maps /start (or triggers) → new conversation</text>
    <text x="800" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#047857">Optional ConversationRuntimeInitializer</text>
  </g>

  <!-- Pending store (right side) -->
  <rect x="900" y="248" width="244" height="168" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="920" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#6d28d9" letter-spacing="0.06em">PERSISTENCE</text>
  <text x="920" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">PendingInteractionStore</text>
  <text x="920" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b21b6">Ask → save → wait → resume</text>

  <rect x="920" y="340" width="64" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="952" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">Memory</text>
  <rect x="992" y="340" width="64" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="1024" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">Redis</text>
  <rect x="1064" y="340" width="64" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="1096" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">JPA</text>

  <text x="920" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#7c3aed">Question + Facts snapshot + TTL</text>

  <!-- Store ↔ core arrows -->
  <path d="M 900 360 L 860 390" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <path d="M 860 410 L 900 380" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="868" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#7c3aed">save</text>
  <text x="868" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#059669">load / delete</text>

  <!-- Footer -->
  <text x="600" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" text-anchor="middle" fill="#94a3b8">github.com/atchurey/talkativebot</text>
</svg>
