<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white" />
  
  <!-- TalkativeBot Triangle -->
  <path d="M 280,300 L 520,150 L 520,450 Z" fill="none" stroke="black" stroke-width="2" />
  <text x="400" y="310" font-family="Arial" font-size="20" text-anchor="middle">TalkativeBot</text>
  
  <!-- Store (Top) -->
  <text x="350" y="40" font-family="Arial" font-size="16" text-anchor="middle">Redis/JPA</text>
  <ellipse cx="350" cy="70" rx="40" ry="15" fill="none" stroke="black" stroke-width="2" />
  <path d="M 310,70 L 310,120 A 40,15 0 0 0 390,120 L 390,70" fill="none" stroke="black" stroke-width="2" />
  <ellipse cx="350" cy="120" rx="40" ry="15" fill="none" stroke="black" stroke-width="2" />
  <text x="350" y="155" font-family="Arial" font-size="16" text-anchor="middle">Store</text>
  <path d="M 400,225 Q 420,180 390,130" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Business Backend (Left) -->
  <rect x="50" y="180" width="120" height="240" rx="15" ry="15" fill="none" stroke="black" stroke-width="2" />
  <text x="110" y="210" font-family="Arial" font-size="16" text-anchor="middle">Business</text>
  <text x="110" y="230" font-family="Arial" font-size="16" text-anchor="middle">Backend</text>
  
  <rect x="70" y="250" width="80" height="40" rx="5" fill="none" stroke="black" stroke-width="1" />
  <text x="110" y="275" font-family="Arial" font-size="12" text-anchor="middle">Service A</text>
  
  <rect x="70" y="305" width="80" height="40" rx="5" fill="none" stroke="black" stroke-width="1" />
  <text x="110" y="330" font-family="Arial" font-size="12" text-anchor="middle">Service B</text>
  
  <rect x="70" y="360" width="80" height="40" rx="5" fill="none" stroke="black" stroke-width="1" />
  <text x="110" y="385" font-family="Arial" font-size="12" text-anchor="middle">Service C</text>
  
  <path d="M 170,300 L 280,300" fill="none" stroke="black" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)" />
  
  <!-- Integration APP (Right) -->
  <text x="700" y="80" font-family="Arial" font-size="16" text-anchor="middle">Integration APP</text>
  
  <!-- Facebook -->
  <rect x="620" y="100" width="160" height="80" fill="none" stroke="black" stroke-width="2" />
  <text x="700" y="145" font-family="Arial" font-size="18" text-anchor="middle">Facebook</text>
  <path d="M 520,200 L 620,140" fill="none" stroke="black" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)" />
  <text x="560" y="160" font-family="Arial" font-size="14" text-anchor="middle">Channel</text>
  <text x="560" y="180" font-family="Arial" font-size="14" text-anchor="middle">Stream</text>
  
  <!-- Telegram -->
  <rect x="620" y="220" width="160" height="80" fill="none" stroke="black" stroke-width="2" />
  <text x="700" y="265" font-family="Arial" font-size="18" text-anchor="middle">Telegram</text>
  <path d="M 520,300 L 620,260" fill="none" stroke="black" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)" />
  <text x="560" y="280" font-family="Arial" font-size="14" text-anchor="middle">Channel</text>
  <text x="560" y="295" font-family="Arial" font-size="14" text-anchor="middle">Rest</text>
  
  <!-- WhatsApp -->
  <rect x="630" y="340" width="160" height="100" fill="none" stroke="black" stroke-width="2" />
  <text x="710" y="400" font-family="Arial" font-size="18" text-anchor="middle">Whatsapp</text>
  <path d="M 520,400 L 630,390" fill="none" stroke="black" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)" />
  <text x="560" y="390" font-family="Arial" font-size="14" text-anchor="middle">Channel</text>
  
  <!-- Quick Test (Bottom) -->
  <rect x="300" y="480" width="200" height="80" fill="none" stroke="black" stroke-width="2" />
  <text x="400" y="525" font-family="Arial" font-size="18" text-anchor="middle">Console App</text>
  <text x="400" y="585" font-family="Arial" font-size="16" text-anchor="middle">Quick Test</text>
  <path d="M 400,450 L 400,480" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="360" y="465" font-family="Arial" font-size="12" text-anchor="middle">Channel</text>
  <text x="360" y="478" font-family="Arial" font-size="12" text-anchor="middle">Console</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black" />
    </marker>
  </defs>
</svg>
