<svg width="1000" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="1200" fill="#f8f9fa" />

  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">TalkativeBot Conversation Flow</text>

  <!-- Start Node -->
  <rect x="425" y="80" width="150" height="50" rx="25" ry="25" fill="#28a745" stroke="#1e7e34" stroke-width="2" />
  <text x="500" y="112" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Incoming Message</text>

  <!-- Connection to Store Check -->
  <line x1="500" y1="130" x2="500" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Check Store -->
  <polygon points="500,170 650,220 500,270 350,220" fill="#ffc107" stroke="#d39e00" stroke-width="2" />
  <text x="500" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Existing</text>
  <text x="500" y="235" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Interaction?</text>

  <!-- Store Reference -->
  <rect x="750" y="195" width="180" height="50" rx="10" ry="10" fill="#6f42c1" stroke="#5a32a3" stroke-width="2" />
  <text x="840" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">PendingInteractionStore</text>
  <path d="M650,220 L750,220" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />

  <!-- Path: NO (Start New) -->
  <line x1="350" y1="220" x2="250" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">No</text>

  <rect x="100" y="195" width="150" height="50" fill="#007bff" stroke="#0056b3" stroke-width="2" />
  <text x="175" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Start Registry</text>

  <line x1="175" y1="245" x2="175" y2="285" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <polygon points="175,285 275,325 175,365 75,325" fill="#ffc107" stroke="#d39e00" stroke-width="2" />
  <text x="175" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Starter</text>
  <text x="175" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Matched?</text>

  <!-- Reject Path -->
  <line x1="75" y1="325" x2="40" y2="325" stroke="#dc3545" stroke-width="2" />
  <line x1="40" y1="325" x2="40" y2="1050" stroke="#dc3545" stroke-width="2" />
  <line x1="40" y1="1050" x2="425" y2="1050" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#dc3545">No</text>

  <!-- Path: YES (Start Resolved) -->
  <line x1="175" y1="365" x2="175" y2="445" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="185" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Yes</text>

  <!-- Path: YES (Resume) -->
  <line x1="500" y1="270" x2="500" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="510" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Yes</text>

  <rect x="425" y="320" width="150" height="50" fill="#007bff" stroke="#0056b3" stroke-width="2" />
  <text x="500" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Option Selector</text>
  <text x="500" y="360" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(if Choice Question)</text>

  <line x1="500" y1="370" x2="500" y2="445" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Merge Start/Resume logic -->
  <rect x="300" y="445" width="400" height="150" rx="15" ry="15" fill="#e9ecef" stroke="#adb5bd" stroke-width="2" />
  <text x="500" y="470" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">Initialization Layer</text>

  <!-- Connections from paths -->
  <path d="M175,445 L300,480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M500,445 L500,480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <rect x="320" y="490" width="160" height="40" fill="#17a2b8" stroke="#117a8b" stroke-width="2" />
  <text x="400" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">ConversationFactory</text>

  <rect x="520" y="490" width="160" height="40" fill="#17a2b8" stroke="#117a8b" stroke-width="2" />
  <text x="600" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">RuntimeRegistry</text>

  <rect x="320" y="540" width="360" height="40" fill="#17a2b8" stroke="#117a8b" stroke-width="2" />
  <text x="500" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Topic Input Handling (Resume only)</text>

  <!-- Proceed to Play Loop -->
  <line x1="500" y1="595" x2="500" y2="640" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- The "Play" Loop -->
  <rect x="300" y="640" width="400" height="320" rx="15" ry="15" fill="#fff" stroke="#007bff" stroke-width="2" stroke-dasharray="10,5" />
  <text x="500" y="665" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#007bff">Conversation Playback Loop</text>

  <!-- Find Next Topic -->
  <rect x="425" y="685" width="150" height="50" fill="#007bff" stroke="#0056b3" stroke-width="2" />
  <text x="500" y="715" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Resolve Topic</text>

  <line x1="500" y1="735" x2="500" y2="765" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Topic Found? -->
  <polygon points="500,765 620,815 500,865 380,815" fill="#ffc107" stroke="#d39e00" stroke-width="2" />
  <text x="500" y="810" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Topic</text>
  <text x="500" y="825" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Found?</text>

  <!-- Path: YES (Play Topic) -->
  <line x1="500" y1="865" x2="500" y2="895" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="510" y="880" font-family="Arial, sans-serif" font-size="12" text-anchor="start">Yes</text>

  <rect x="425" y="895" width="150" height="50" fill="#007bff" stroke="#0056b3" stroke-width="2" />
  <text x="500" y="925" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Topic.play()</text>

  <!-- Path: NO (Finish) -->
  <line x1="620" y1="815" x2="750" y2="815" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="680" y="805" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">No (Closed)</text>

  <!-- Ask Question path -->
  <line x1="500" y1="945" x2="500" y2="990" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Interaction & Delivery -->
  <rect x="750" y="980" width="180" height="80" rx="10" ry="10" fill="#e9ecef" stroke="#adb5bd" stroke-width="2" />
  <text x="840" y="1005" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Store Interaction</text>
  <text x="840" y="1025" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Wait for User...</text>
  <path d="M840,1035 L840,1120 L980,1120 L980,105 L575,105" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowhead)" />
  <text x="960" y="550" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 960,550)">Future Input Resumes Flow</text>

  <!-- Output Registry -->
  <rect x="425" y="990" width="150" height="60" fill="#20c997" stroke="#1ba37e" stroke-width="2" />
  <text x="500" y="1015" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Output Registry</text>
  <text x="500" y="1035" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(Select Channel)</text>

  <!-- Connection to Delivery -->
  <line x1="575" y1="1020" x2="750" y2="1020" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Finish Node -->
  <rect x="750" y="790" width="150" height="50" rx="25" ry="25" fill="#6c757d" stroke="#495057" stroke-width="2" />
  <text x="825" y="822" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Conversation Finished</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="50" y="1100" width="300" height="80" rx="5" ry="5" fill="white" stroke="#ccc" stroke-width="1" />
  <text x="60" y="1115" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Legend</text>
  <circle cx="70" cy="1135" r="5" fill="#28a745" /> <text x="85" y="1140" font-family="Arial, sans-serif" font-size="10">Entry Point</text>
  <circle cx="70" cy="1155" r="5" fill="#007bff" /> <text x="85" y="1160" font-family="Arial, sans-serif" font-size="10">Core Process / Registry</text>
  <circle cx="180" cy="1135" r="5" fill="#ffc107" /> <text x="195" y="1140" font-family="Arial, sans-serif" font-size="10">Decision</text>
  <circle cx="180" cy="1155" r="5" fill="#6f42c1" /> <text x="195" y="1160" font-family="Arial, sans-serif" font-size="10">Persistence</text>
</svg>
